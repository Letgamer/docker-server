services:
  bloodhound:
    image: docker.io/specterops/bloodhound:latest
    restart: always
    container_name: bloodhound
    environment:
      bhe_disable_cypher_complexity_limit: true
      bhe_enable_cypher_mutations: true
      bhe_graph_query_memory_limit: 0
      bhe_database_connection: 'user=bloodhound password=${POSTGRES_PASSWORD} dbname=bloodhound host=bloodhound-db'
      bhe_neo4j_connection: neo4j://neo4j:${NEO4J_SECRET}@bloodhound-neo4j:7687/
      bhe_graph_driver: neo4j
      bhe_bloodhound_host: 0.0.0.0
      bhe_bloodhound_port: 8080
      bhe_bind_addr: '0.0.0.0:8080'
      bhe_root_url: 'https://ad.${DOMAIN}/'
      bhe_crypto_jwt_signing_key: ${JWT}
      bhe_default_admin_principal_name: admin
      bhe_default_admin_password: ${PASSWORD}
      bhe_default_admin_email_address: admin@admin
      bhe_default_admin_first_name: admin
      bhe_default_admin_last_name: admin
    # volumes:
    #   - ./bloodhound.config.json:/bloodhound.config.json:ro
    depends_on:
      bloodhound-db:
        condition: service_healthy
      bloodhound-neo4j:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.bloodhound.rule=Host(`ad.${DOMAIN}`)
      - traefik.http.routers.bloodhound.entrypoints=websecure
      - traefik.http.routers.bloodhound.tls=true
      - traefik.http.routers.bloodhound.service=bloodhound
      - traefik.http.services.bloodhound.loadbalancer.server.port=8080
    networks:
      - bloodhound
      - cloudflaretunnel
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  bloodhound-db:
    image: docker.io/library/postgres:16
    restart: always
    container_name: bloodhound-db
    environment:
      PGUSER: bloodhound
      POSTGRES_USER: bloodhound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bloodhound
    networks:
      - bloodhound
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bloodhound -d bloodhound -h 127.0.0.1 -p 5432" ]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  bloodhound-neo4j:
    image: docker.io/library/neo4j:4.4.42
    restart: always
    container_name: bloodhound-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_SECRET}
      NEO4J_dbms_allow__upgrade: true
    networks:
      - bloodhound
    volumes:
      - ./neo4j-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -O /dev/null -q http://127.0.0.1:7474 || exit 1" ]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  bloodhound:
  cloudflaretunnel:
    external: true
